<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A & I Chat</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<section id="login" class="login"><h1>A ♡ I Chat</h1><p>Private · Connect · Chat · Share</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><small id="status">Supabase details app.js में भरें।</small></section>
<main id="app" class="app hide"><header><b>A ♡ I Chat</b><button id="more">⋮</button></header><div id="menu" class="menu hide"><button id="searchBtn">Search</button><button id="binBtn">Recycle Bin</button><button id="exportBtn">Export chat</button><button id="logout">Logout</button></div><div class="people"><span>🔵 A · Chat</span><span>🟣 Isha · Chat</span></div><input id="search" class="hide search" placeholder="Search messages..."><section id="messages" class="messages">आपकी बातचीत यहाँ दिखाई देगी।</section><section id="bin" class="bin hide"><b>Recycle Bin</b><button id="closeBin">✕</button><div id="deleted"></div></section><footer><form id="formA" class="composer a"><b>A</b><input id="textA" placeholder="A की तरफ़ से message..."><label>＋<input id="fileA" type="file" accept="image/*,video/*,audio/*" hidden></label><button>➤</button></form><form id="formI" class="composer i"><b>Isha</b><input id="textI" placeholder="Isha की तरफ़ से message..."><label>＋<input id="fileI" type="file" accept="image/*,video/*,audio/*" hidden></label><button>➤</button></form><nav><span>▣ Chats</span><span>▧ Media</span><span>♫ Audio</span><span>♲ Bin</span><span>● Profile</span></nav></footer></main><div id="viewer" class="viewer hide"><button id="closeViewer">✕</button><div id="viewerBody"></div></div><script src="app.js"></script></body></html>
